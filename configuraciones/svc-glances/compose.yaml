name: svc-glances
services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      GLANCES_OPT: -w -B 192.168.50.11 --disable-check-update --disable-config-exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /srv/plataforma/datos:/host/datos:ro
