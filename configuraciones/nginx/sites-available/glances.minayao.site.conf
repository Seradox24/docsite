server {
    listen 80;
    listen [::]:80;
    server_name glances.minayao.site;
    server_tokens off;
    return 301 https://glances.minayao.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glances.minayao.site;
    server_tokens off;
    ssl_certificate /srv/plataforma/infraestructura/tls/lan-monitoring/fullchain.pem;
    ssl_certificate_key /srv/plataforma/infraestructura/tls/lan-monitoring/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LANSSL:10m;
    ssl_session_timeout 1d;
    add_header X-Platform-Server moodlenewen always;
    access_log /var/log/nginx/glances.minayao.site.access.log;
    error_log /var/log/nginx/glances.minayao.site.error.log;
    client_max_body_size 20m;

    location / {
        proxy_pass http://192.168.50.11:61208;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
