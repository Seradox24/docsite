server {
    listen 80;
    listen [::]:80;
    server_name port.minayao.site;
    server_tokens off;
    return 301 https://port.minayao.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name port.minayao.site;
    server_tokens off;
    ssl_certificate /srv/plataforma/infraestructura/tls/lan-monitoring/fullchain.pem;
    ssl_certificate_key /srv/plataforma/infraestructura/tls/lan-monitoring/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LANSSL:10m;
    ssl_session_timeout 1d;
    add_header X-Platform-Server moodlenewen always;
    access_log /var/log/nginx/port.minayao.site.access.log;
    error_log /var/log/nginx/port.minayao.site.error.log;
    client_max_body_size 20m;

    location / {
        proxy_pass https://192.168.50.11:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lan_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /srv/plataforma/infraestructura/tls/portainer-upstream/server.pem;
    }
}
